# ============================================
#  UDP数据转发器配置文件
# ============================================

[Files]
gnss_file = GNSSdata.txt
imu_file = IMUdata.txt

[Network]
target_ip = 127.0.0.1
target_port = 8888

[ForwardParams]
speed_multiplier = 10.0
auto_start = true
imu_frequency = 200
gnss_frequency = 1

[Filter]
start_time = 0.0
end_time = 0.0
filter_by_time = false

# ========== 配置结束 ==========